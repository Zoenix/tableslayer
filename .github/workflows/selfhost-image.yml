name: Self-host image

# Builds the self-hosted image and publishes it to GitHub Container Registry as
# ghcr.io/<owner>/tableslayer:latest (plus a tag per commit).

on:
  workflow_dispatch:
  push:
    branches:
      - selfhost

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository != 'Siege-Perilous/tableslayer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tableslayer" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
